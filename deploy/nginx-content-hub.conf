# nginx vhost for the content-hub CMS, following the same pattern as the other
# Tiptop sites (see baby-seat-taxi-sydney's new.babyseattaxisydney.com.au vhost).
# Path: /etc/nginx/sites-available/cms.babyseattaxisydney.com.au

server {
    listen 80;
    server_name cms.babyseattaxisydney.com.au;

    # Payload media uploads can be large; raise the default 1m limit.
    client_max_body_size 25m;

    location / {
        proxy_pass http://localhost:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
